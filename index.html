<!-- PRODUCT MODAL -->
<div id="productModal" class="modal">
    <div class="modal-content">

        <img id="modalImage">
        <h2 id="modalTitle"></h2>

<script>

// tabs
function showTab(id){

    document.querySelectorAll(".tab-content").forEach(e=>{
        e.style.display="none";
    });

    document.querySelectorAll(".tab").forEach(btn=>{
        btn.classList.remove("active");
    });

    document.getElementById(id).style.display="flex";

    event.target.classList.add("active");
}
document.addEventListener("DOMContentLoaded", ()=>{

    document.getElementById("black").style.display="flex";

    document.querySelector(".tab").classList.add("active");

});
// contact
function openContact(){
    document.getElementById("contactModal").style.display="flex";
}
function closeContact(){
    document.getElementById("contactModal").style.display="none";
}

// product modal
document.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("click", ()=>{

        const modal = document.getElementById("productModal");
        modal.style.display="flex";

        document.getElementById("modalImage").src = card.dataset.img;
        document.getElementById("modalTitle").innerText = card.dataset.title;
        document.getElementById("modalCode").innerText = "الكود: " + card.dataset.code;
        document.getElementById("modalPrice").innerText = "السعر: " + card.dataset.price;
        document.getElementById("modalType").innerText = "النوع: " + card.dataset.type;
        document.getElementById("modalFabric").innerText = "القماش: " + card.dataset.fabric;

    });
});

// close modal
function closeProduct(){
    document.getElementById("productModal").style.display="none";
}

// click outside
window.onclick = function(e){
    if(e.target.id==="productModal") closeProduct();
    if(e.target.id==="contactModal") closeContact();
}

</script>
